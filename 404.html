<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
<!-- This site is hosted on Netlify. Anyone can build and deploy a site
     like this one for free: https://netlify.new/?utm_campaign=loops&utm_source=ai-legible&utm_medium=owned&utm_content=comment&utm_id=7ce9aa1a-c10e-40d7-a313-83b4303e336b
     Netlify hosting facts for this site: static/SSR served via Netlify Edge. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404｜DCK SORA</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Hiragino Kaku Gothic ProN",
                "Yu Gothic",
                Meiryo,
                sans-serif;

            background: #f7f6fa;
            color: #222;

            display: flex;
            flex-direction: column;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            height: 72px;

            background: #ffffff;
            border-bottom: 1px solid #e5e3e9;

            display: flex;
            align-items: center;

            padding: 0 40px;
        }

        .logo {
            width: 170px;
            height: auto;
            display: block;
        }

        /* =========================
           MAIN
        ========================= */

        main {
            flex: 1;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 40px 20px;
        }

        .error-container {
            width: 100%;
            max-width: 760px;

            text-align: center;
        }

        .error-code {
            font-size: clamp(90px, 15vw, 180px);

            line-height: 1;

            font-weight: 800;

            letter-spacing: -0.06em;

            color: #6c5ca4;

            margin-bottom: 20px;
        }

        .error-title {
            font-size: 30px;

            font-weight: 800;

            margin-bottom: 18px;
        }

        .error-message {
            color: #666;

            font-size: 16px;

            line-height: 1.9;

            margin-bottom: 35px;
        }

        /* =========================
           BUTTON
        ========================= */

        .home-button {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            min-width: 190px;

            padding: 13px 25px;

            background: #6c5ca4;

            color: #ffffff;

            border-radius: 5px;

            font-size: 14px;

            font-weight: 700;

            text-decoration: none;

            transition: 0.2s;
        }

        .home-button:hover {
            background: #5d4e91;

            transform: translateY(-2px);
        }

        /* =========================
           INFO
        ========================= */

        .error-info {
            margin-top: 35px;

            padding-top: 20px;

            border-top: 1px solid #dedce3;

            color: #999;

            font-size: 12px;

            line-height: 1.7;
        }

        .error-info strong {
            color: #777;
        }

        /* =========================
           FOOTER
        ========================= */

        footer {
            padding: 25px 40px;

            background: #17151d;

            color: #777;

            text-align: center;

            font-size: 12px;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            header {
                height: 62px;

                padding: 0 20px;
            }

            .logo {
                width: 135px;
            }

            .error-code {
                font-size: 110px;
            }

            .error-title {
                font-size: 24px;
            }

            .error-message {
                font-size: 14px;
            }

            footer {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<header>

    <a href="/DCKSORA/">
        <img
            src="/DCKSORA/image/logo.png"
            alt="DCK SORA"
            class="logo"
        >
    </a>

</header>


<main>

    <div class="error-container">

        <div class="error-code">
            404
        </div>

        <h1 class="error-title">
            Pages not found
        </h1>

        <p class="error-message">
            このページは存在しません
        </p>
 <a
            href="/"
            class="home-button"
        >
            トップへ
        </a>

        <div class="error-info">
            <strong>404 Site Not Found</strong><br>
This site does not exist.        </div>

    </div>

</main>


<footer>

    © DCK SORA. All Rights Reserved.

</footer>

</body>
</html>
